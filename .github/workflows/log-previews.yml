name: Log preview URL

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: previews-log
  cancel-in-progress: false

jobs:
  log:
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'cloudflare-workers-and-pages[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Parse comment and gather data
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;

            if (!body.includes('Deployment successful')) {
              core.info('Comment is not a successful deployment, skipping');
              core.setOutput('skip', 'true');
              return;
            }

            core.info(`Comment body (first 2000 chars):\n${body.substring(0, 2000)}`);

            const tryMatch = (...patterns) => {
              for (const re of patterns) {
                const m = body.match(re);
                if (m) return m[1];
              }
              return null;
            };

            const url =
              tryMatch(
                /\[Branch Preview URL\]\(([^)]+)\)/,
                /<a\s+[^>]*href=["']([^"']+)["'][^>]*>\s*Branch Preview URL\s*<\/a>/i,
              ) ||
              tryMatch(
                /\[Commit Preview URL\]\(([^)]+)\)/,
                /<a\s+[^>]*href=["']([^"']+)["'][^>]*>\s*Commit Preview URL\s*<\/a>/i,
              ) ||
              tryMatch(/(https:\/\/[a-z0-9-]+(?:\.[a-z0-9-]+)+\.workers\.dev[^\s<"')]*)/i);

            if (!url) {
              core.info('No preview URL found in comment, skipping');
              core.setOutput('skip', 'true');
              return;
            }

            core.info(`Extracted preview URL: ${url}`);

            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('skip', 'false');
            core.setOutput('number', prNumber);
            core.setOutput('title', pr.title);
            core.setOutput('author', pr.user.login);
            core.setOutput('branch', pr.head.ref);
            core.setOutput('sha', pr.head.sha.substring(0, 7));
            core.setOutput('url', url);
            core.setOutput('date', new Date().toISOString().slice(0, 10));

      - name: Append row to previews.md
        if: steps.parse.outputs.skip != 'true'
        env:
          DATE: ${{ steps.parse.outputs.date }}
          PR_NUM: ${{ steps.parse.outputs.number }}
          PR_TITLE: ${{ steps.parse.outputs.title }}
          AUTHOR: ${{ steps.parse.outputs.author }}
          BRANCH: ${{ steps.parse.outputs.branch }}
          SHA: ${{ steps.parse.outputs.sha }}
          URL: ${{ steps.parse.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          FILE=previews.md
          if [ ! -f "$FILE" ]; then
            {
              echo '# Preview deployments'
              echo ''
              echo 'Auto-logged on every successful Cloudflare preview deploy.'
              echo ''
              echo '| Date | PR | Author | Branch | Commit | URL |'
              echo '|------|-----|--------|--------|--------|-----|'
            } > "$FILE"
          fi

          SAFE_TITLE="${PR_TITLE//|/\\|}"
          SAFE_TITLE="${SAFE_TITLE//$'\n'/ }"

          if grep -qF "| \`${SHA}\` | ${URL} |" "$FILE"; then
            echo "Row already exists for this commit + URL, skipping"
            exit 0
          fi

          printf '| %s | [#%s](https://github.com/%s/pull/%s) %s | @%s | `%s` | `%s` | %s |\n' \
            "$DATE" "$PR_NUM" "$REPO" "$PR_NUM" "$SAFE_TITLE" "$AUTHOR" "$BRANCH" "$SHA" "$URL" >> "$FILE"

      - name: Commit and push
        if: steps.parse.outputs.skip != 'true'
        env:
          PR_NUM: ${{ steps.parse.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: log preview for PR #${PR_NUM} [skip ci]"
          git pull --rebase origin main
          git push origin main
